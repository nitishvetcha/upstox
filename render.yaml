# Render Blueprint Configuration for Upstox Analyzer & Telegram Market Bot
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: upstox-analyzer
    runtime: node
    plan: starter # Starter plan recommended for 24/7 background worker stability; or change to 'free'
    region: singapore # Low latency to NSE (India)
    rootDir: web
    buildCommand: npm install && npm run build
    startCommand: npm run start:render
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.2
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: NOTIFICATION_ENABLED
        value: "true"
      - key: NOTIFICATION_MIN_GRADE
        value: "B"
      - key: UPSTOX_CLIENT_ID
        sync: false
      - key: UPSTOX_CLIENT_SECRET
        sync: false
      - key: UPSTOX_REDIRECT_URI
        sync: false
      - key: UPSTOX_ANALYTICS_TOKEN
        sync: false
